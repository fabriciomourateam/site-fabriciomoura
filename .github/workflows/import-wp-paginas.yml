name: Importar páginas do WordPress

# Copia sobre, contato, termos, privacidade, renovação, links e páginas de venda para content/paginas.
# Roda por botão ou quando o script muda.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import-wp-paginas.mjs
      - .github/workflows/import-wp-paginas.yml

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Importar
        env:
          WP_SOURCE: https://fabriciomoura.com
        run: node scripts/import-wp-paginas.mjs
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/paginas public/paginas public/wp-content
          if git diff --staged --quiet; then
            echo "Nada novo."
          else
            git commit -m "chore(paginas): importa páginas do WordPress"
            git push
          fi
