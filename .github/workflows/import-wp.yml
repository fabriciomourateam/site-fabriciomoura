name: Importar blog do WordPress

# Copia os posts e imagens do WordPress para content/blog e public/wp-content (mesmas URLs).
# 27/10/2026: SÓ POR BOTÃO (Run workflow). O agendamento diário e o gatilho de push foram removidos:
# os posts do WordPress foram despublicados (24/10) e o blog agora é só do Next (o robô publica via
# /api/blog). Em 26/10 a importação automática SOBRESCREVEU os artigos limpos (sem hormônio) com o texto
# antigo do WP; a trava do site tirou 10 artigos do ar (404) e um sitelink do Google Ads foi reprovado.
# NÃO rode sem conferir antes: ela substitui content/blog pelo que está no WordPress.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-wp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Importar
        env:
          WP_SOURCE: https://fabriciomoura.com
        run: node scripts/import-wp.mjs
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog public/wp-content
          if git diff --staged --quiet; then
            echo "Nada novo."
          else
            git commit -m "chore(blog): importa posts e imagens do WordPress"
            git push
          fi
